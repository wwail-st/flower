<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>测测你是哪种云南花</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:"Microsoft YaHei","PingFang SC","Noto Serif SC",sans-serif;
  background:linear-gradient(160deg,#F5EDDA 0%,#FAF3E0 30%,#FDF8F0 60%,#F5EDDA 100%);
  color:#3B3B3B;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  position:relative;
  overflow-x:hidden;
}

/* 背景花瓣装饰 */
body::before,body::after{
  content:"🌸";
  position:fixed;
  font-size:8rem;
  opacity:.06;
  pointer-events:none;z-index:0;
  animation:floatPetals 12s ease-in-out infinite;
}
body::before{top:-40px;left:-30px;animation-delay:0s}
body::after{bottom:-40px;right:-30px;font-size:10rem;animation-delay:-5s}
@keyframes floatPetals{
  0%,100%{transform:translateY(0) rotate(0deg)}
  25%{transform:translateY(-20px) rotate(3deg)}
  75%{transform:translateY(10px) rotate(-3deg)}
}

.card{
  width:100%;max-width:440px;
  background:linear-gradient(180deg,#FFFDF9 0%,#FFF9F0 100%);
  border-radius:24px;
  box-shadow:0 4px 60px rgba(139,115,85,.10),0 1px 4px rgba(0,0,0,.04);
  padding:40px 32px 36px;
  text-align:center;
  position:relative;z-index:1;
  overflow:hidden;
  min-height:400px;
}

/* 顶部金边 + 暗纹 */
.card::before{
  content:"";
  position:absolute;top:0;left:20px;right:20px;
  height:3px;
  background:linear-gradient(90deg,transparent,#D4A373 20%,#E8C547 50%,#D4A373 80%,transparent);
  border-radius:0 0 2px 2px;
}
.card::after{
  content:"";
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(212,163,115,.04) 0%,transparent 70%);
  pointer-events:none;
}

/* ===== 开始页 ===== */
.start-emoji{
  font-size:4.5rem;
  margin-bottom:12px;
  animation:float 2.4s ease-in-out infinite;
  display:inline-block;
}
.start-title{
  color:#2C5F2D;
  font-size:1.5rem;font-weight:bold;
  margin-bottom:8px;
  letter-spacing:1px;
}
.start-sub{
  color:#8B7355;
  font-size:.82rem;
  margin-bottom:28px;
  line-height:1.8;
}
.start-btn{
  display:inline-block;
  padding:15px 52px;
  background:linear-gradient(135deg,#D4A373 0%,#C0714A 100%);
  color:#fff;
  border:none;
  border-radius:32px;
  font-size:1.15rem;font-weight:bold;
  cursor:pointer;
  letter-spacing:2px;
  box-shadow:0 6px 24px rgba(192,113,74,.35),0 0 0 8px rgba(212,163,115,.08);
  transition:all .3s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.start-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 32px rgba(192,113,74,.45),0 0 0 12px rgba(212,163,115,.12);
}
.start-btn:active{transform:translateY(0) scale(.97)}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* ===== 答题区 ===== */
.progress{
  display:flex;gap:6px;
  justify-content:center;
  margin-bottom:24px;
  flex-wrap:wrap;
}
.progress span{
  width:28px;height:4px;
  background:#EDE4D5;
  border-radius:3px;
  transition:all .4s ease;
}
.progress span.done{
  background:linear-gradient(90deg,#D4A373,#E8C547);
  box-shadow:0 0 6px rgba(212,163,115,.3);
}

.q-title{
  color:#2C5F2D;
  font-size:1.05rem;font-weight:600;
  margin-bottom:20px;
  min-height:48px;
  line-height:1.6;
}

.opts{display:flex;flex-direction:column;gap:10px}

.opt{
  padding:15px 18px;
  background:#FFF;
  border:2px solid #F0E6D5;
  border-radius:14px;
  cursor:pointer;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  text-align:left;
  font-size:.9rem;line-height:1.5;
  display:flex;align-items:center;gap:12px;
  position:relative;
}
.opt::after{
  content:"";position:absolute;
  left:0;top:10%;height:80%;width:3px;
  border-radius:0 3px 3px 0;
  background:transparent;
  transition:background .25s;
}
.opt:hover{
  border-color:#D4A373;
  background:linear-gradient(135deg,#FFFBF5,#FFF6EB);
  transform:translateX(3px);
  box-shadow:0 4px 16px rgba(212,163,115,.12);
}
.opt:hover::after{background:#D4A373}
.opt:active{transform:scale(.98)}
.opt .emoji{
  font-size:1.5rem;
  flex-shrink:0;
  width:32px;text-align:center;
}

/* ===== 结果页 ===== */
.result .big-emoji{
  font-size:5.5rem;
  margin-bottom:14px;
  animation:float 3s ease-in-out infinite;
  display:inline-block;
}
.result h3{
  color:#2C5F2D;
  font-size:1.55rem;font-weight:bold;
  margin-bottom:6px;
  letter-spacing:1px;
}
.result .type{
  color:#C0714A;
  font-weight:600;
  font-size:.88rem;
  margin-bottom:14px;
  padding:6px 20px;
  background:rgba(212,163,115,.10);
  border-radius:20px;
  display:inline-block;
}
.result .desc{
  font-size:.9rem;
  color:#5A4A3A;
  line-height:1.9;
  margin-bottom:14px;
  text-align:left;
  padding:0 4px;
}
.result .cake{
  background:linear-gradient(135deg,#FFFBF5,#FDF5EA);
  border:1.5px solid #EDE4D5;
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:14px;
  font-size:.88rem;
  color:#5D5D5D;
  line-height:1.8;
  text-align:left;
  position:relative;
}
.result .cake::before{
  content:"";position:absolute;
  top:0;left:14px;right:14px;
  height:1px;
  background:linear-gradient(90deg,transparent,#E8C547,transparent);
}
.result .cake strong{
  color:#2C5F2D;
  display:block;
  margin-bottom:6px;
  font-size:.9rem;
}
.result .tag{
  display:inline-block;
  background:linear-gradient(135deg,#FFFBF5,#FFF6EB);
  border:1.5px solid #DDB58A;
  color:#B8784A;
  border-radius:18px;
  padding:5px 16px;
  font-size:.78rem;font-weight:500;
  margin:3px;
  letter-spacing:.5px;
}
.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 36px;
  background:linear-gradient(135deg,#D4A373,#C0714A);
  color:#fff;font-weight:600;
  border:none;
  border-radius:24px;
  font-size:.92rem;
  cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  letter-spacing:1px;
  box-shadow:0 4px 16px rgba(192,113,74,.25);
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(192,113,74,.35);
}
.btn:active{transform:scale(.96)}

/* ===== 动画 ===== */
.fade{animation:fadeIn .45s cubic-bezier(.4,0,.2,1)}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

var R = {
  1:{emoji:"🌹",name:"食用玫瑰",type:"你是热烈浪漫的人间烟火",desc:"你是云南低海拔暖谷里那朵尽情绽放的食用玫瑰——热情、直爽、敢爱敢恨。越热烈的阳光你越盛开，走到哪儿都是人群里最鲜活的存在。你喜欢浓烈的甜，也享受俗世的烟火气。从南诏百花宴到今天的嘉华门店——玫瑰花就是那个敢在所有人面前说“我就要开”的品种，跟你一模一样。",cake:"🥮 专属鲜花饼风格：经典原味现烤饼。趁热吃，酥皮簌簌往下掉，玫瑰馅甜得坦坦荡荡——跟你的人一样，从不藏着掖着。",tags:["热情直爽","热爱生活","甜而不腻","人间烟火"]},

  3:{emoji:"🪷",name:"兰花",type:"你是清雅出尘的隐士之花",desc:"你像苍山深处那株幽兰——安静、内敛、不争不抢却自有风骨。兰茂在《滇南本草》里写兰花，不是因为它最香，而是因为它长在最不起眼的山谷里，恰好被最懂花的人看见。你不急于被理解——该懂你的人，自然会来。",cake:"🥮 专属鲜花饼风格：花茶配手工慢烤。不急——饼不赶时间，你也不赶。配一杯普洱细细嚼，别人吃饼为解馋，你是为了品。",tags:["清雅内敛","自有风骨","慢热型","深藏不露"]},
  4:{emoji:"🌸",name:"高原百合",type:"你是纯粹通透的澄澈之花",desc:"你不随波逐流，像高海拔冷凉区悄然绽放的反季百合——不在主流赛道里争抢，却在最淡的季节开出最干净的花。合香楼老师傅的手艺传了一百多年，不是因为想火，是因为有人还在认真揉那块酥皮。你也是这种人——温和而有力量，纯粹而不简单。",cake:"🥮 专属鲜花饼风格：古法手工慢烤。不要花哨包装，不要噱头口味——就要最原始那朵玫瑰、最传统那团酥皮。简单，就是最强的表达。",tags:["纯粹通透","温柔有力量","不争不抢","干净澄澈"]},
  5:{emoji:"🌸",name:"滇山茶",type:"你是端庄大气的从容之花",desc:"你像昆明金殿那棵百年山茶树——从来不急不躁，每年春节前后准时开满一树繁花。你有一种稳如泰山的从容感，不需要证明什么，存在本身就让人放心。云南八大名花之首不是争来的，是一年年开出来的——你的底气也一样。",cake:"🥮 专属鲜花饼风格：经典礼盒装。不花里胡哨，但拿出来谁都认识——你是那个永远不出错的选择，也是那个最不能被替代的底气。",tags:["端庄大气","从容不迫","经典永存","稳如泰山"]},
  6:{emoji:"🌺",name:"三角梅",type:"你是坚韧不拔的生命之花",desc:"你是云南干热河谷里那株三角梅——不在乎土壤、不需要精心打理，墙根下、公路边，只要有一点阳光就能开成瀑布。你在什么环境下都能活出自己的样子，别人羡慕你皮实，你说从来没人给过你第二个选项。但正是这种韧性，让你最不可战胜。",cake:"🥮 专属鲜花饼风格：随时随地都能吃到的街边烤饼。不讲究场合，不讲究仪式感，给个墙根就能长成花瀑——你的饼跟你的生命力一样顽强。",tags:["坚韧顽强","生命力爆棚","朴实无华","生生不息"]},

var el = document.getElementById("app");
var scores = {};
var cur = 0;

function showStart(){
  var h = '<div class="fade">';
  h += '<div class="start-emoji">🌸</div>';
  h += '<div class="start-title">🌸 测测你是哪种云南花</div>';
  h += '<div class="start-sub">10道题，12种花——<br>看看你的性格最像云南的哪朵花<br>还有你的专属鲜花饼风格 🥮</div>';
  h += '<button class="start-btn" data-action="start">开始测试</button>';
  h += '</div>';
  el.innerHTML = h;
}

function startQuiz(){
  for(var i=1;i<=12;i++) scores[i]=0;
  cur=0;
  renderQ();
}

function renderQ(){
  if(cur>=Q.length){showResult();return;}
  var q=Q[cur];
  var h='<div class="fade">';
  h+='<div class="progress">';
  for(var i=0;i<Q.length;i++) h+='<span class="'+(i<cur?'done':'')+'"></span>';
  h+='</div>';
  h+='<div class="q-title">'+(cur+1)+'/'+Q.length+'  '+q.q+'</div>';
  h+='<div class="opts">';
  for(var j=0;j<q.o.length;j++){
    var o=q.o[j];
    h+='<div class="opt" data-action="pick" data-s=\''+JSON.stringify(o.s)+'\'><span class="emoji">'+o.e+'</span>'+o.t+'</div>';
  }
  h+='</div></div>';
  el.innerHTML=h;
}

function handlePick(opt){
  var ids=JSON.parse(opt.getAttribute('data-s'));
  for(var i=0;i<ids.length;i++) scores[ids[i]]++;
  cur++;
  renderQ();
}

function showResult(){
  var best=1;
  for(var i=2;i<=12;i++){if(scores[i]>scores[best])best=i;}
  var r=R[best];
  if(!r){best=1;r=R[1];}
  var h='<div class="result fade">';
  h+='<div class="big-emoji">'+r.emoji+'</div>';
  h+='<h3>'+r.name+'</h3>';
  h+='<div class="type">'+r.type+'</div>';
  h+='<div class="desc">'+r.desc+'</div>';
  h+='<div class="cake">'+r.cake+'</div>';
  for(var k=0;k<r.tags.length;k++) h+='<span class="tag">'+r.tags[k]+'</span>';
  h+='<br><button class="btn" data-action="start">♻️ 再测一次</button>';
  h+='</div>';
  el.innerHTML=h;
}

// 事件委托
el.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if(!btn) return;
  var action = btn.getAttribute('data-action');
  if(action === 'start') startQuiz();
  if(action === 'pick') handlePick(btn);
});

showStart();
</script>
