<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>测测你是哪种云南花</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#FAF3E0;color:#3B3B3B;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:440px;background:#FFF9F0;border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,0.08);padding:36px 30px;text-align:center;position:relative;overflow:hidden;max-height:90vh;overflow-y:auto}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#D4A373,#E8C547,#D4A373)}
h2{color:#2C5F2D;font-size:1.3rem;margin-bottom:6px}
.sub{color:#8B7355;font-size:0.78rem;margin-bottom:18px}
.progress{display:flex;gap:5px;justify-content:center;margin-bottom:22px}
.progress span{width:28px;height:4px;background:#E8DDCF;border-radius:2px;transition:all 0.3s}
.progress span.done{background:#D4A373}
.q-title{color:#2C5F2D;font-size:1rem;margin-bottom:16px;min-height:44px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{padding:14px 16px;background:#FFF;border:2px solid #E8DDCF;border-radius:12px;cursor:pointer;transition:all 0.2s;text-align:left;font-size:0.88rem;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:#D4A373;background:#FFF6EB}
.opt .emoji{font-size:1.4rem;flex-shrink:0;width:28px;text-align:center}
.result .big-emoji{font-size:5rem;margin-bottom:10px}
.result h3{color:#2C5F2D;font-size:1.5rem;margin-bottom:4px}
.result .type{color:#D4A373;font-weight:bold;font-size:0.85rem;margin-bottom:10px}
.result .cake{background:linear-gradient(135deg,#FFF6EB,#FFF9F0);border:1px solid #E8DDCF;border-radius:12px;padding:12px;margin-bottom:10px;font-size:0.85rem;color:#5D5D5D;line-height:1.7;text-align:left}
.result .cake strong{color:#C0392B;display:block;margin-bottom:2px}
.result .desc{font-size:0.88rem;color:#5D5D5D;line-height:1.8;margin-bottom:10px}
.result .tag{display:inline-block;background:#FFF6EB;border:1px solid #D4A373;color:#D4A373;border-radius:16px;padding:4px 14px;font-size:0.75rem;margin:3px}
.btn{display:inline-block;margin-top:18px;padding:10px 30px;background:#D4A373;color:#fff;border:none;border-radius:20px;font-size:0.9rem;cursor:pointer;transition:all 0.2s}
.btn:hover{background:#C0392B}
.fade{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
var Q = [
  {q:"如果鲜花饼也有"人格"，你觉得它最像什么？",o:[
    {e:"🔥",t:"外表朴实，咬开全是热烈的甜——像一团火藏着",s:[1]},
    {e:"🧘",t:"不声不响躺在一堆伴手礼里，懂行的人才会拿起它",s:[3]},
    {e:"💪",t:"走到哪都是顶流，跟谁都百搭，从不出错",s:[5]},
    {e:"✨",t:"简简单单的酥皮花馅，干干净净的云南味道",s:[4]}
  ]},
  {q:"走进云南的花田，你最先被哪种花吸引？",o:[
    {e:"🌹",t:"成片的玫瑰，浓烈的香扑面而来——心跳直接加速",s:[1]},
    {e:"🌺",t:"高山上独自开着的杜鹃，像一团火悬在峭壁上",s:[2]},
    {e:"🌻",t:"永远朝太阳的金色花盘，好像永远不会累",s:[10]},
    {e:"💮",t:"不起眼的报春花，星星点点铺满整片草地",s:[8]}
  ]},
  {q:"吃鲜花饼时你最享受哪一个瞬间？",o:[
    {e:"🥮",t:"一口咬下去，玫瑰馅在嘴里炸开的甜",s:[1]},
    {e:"☕",t:"配一杯普洱慢慢品，不急不躁地嚼每一口",s:[3]},
    {e:"🤤",t:"刚出炉还烫手就忍不住咬，酥皮簌簌往下掉",s:[2]},
    {e:"🍃",t:"吃完嘴里留着淡淡花香，能回味一整个下午",s:[11]}
  ]},
  {q:"你觉得哪一种花最像你的人生哲学？",o:[
    {e:"🌺",t:"给点阳光就灿烂，不给阳光也灿烂——活着就要尽兴",s:[6]},
    {e:"🏵️",t:"海拔四千米还在开花——环境越难，我越要证明自己",s:[7]},
    {e:"🌼",t:"第一个报告春天来了——永远比别人快半步",s:[8]},
    {e:"💐",t:"历经风雨后开得最久——时间会证明谁是对的",s:[12]}
  ]},
  {q:"朋友去云南旅游，你第一个推荐什么？",o:[
    {e:"🎁",t:"刚烤好的鲜花饼！趁热咬一口是人生必做小事",s:[1]},
    {e:"🫖",t:"去大理的茶馆喝一壶花茶，风花雪月都在杯子里",s:[3]},
    {e:"📸",t:"去斗南花市，看每4秒一槌的拍卖——震撼到说不出话",s:[5]},
    {e:"💐",t:"挑一束当季鲜切花带回酒店，晚上床头都是花香",s:[9]}
  ]},
  {q:"如果让你用一种口感形容自己的性格，你选？",o:[
    {e:"🥮",t:"酥脆和绵密兼具——熟了以后话很多，越处越甜",s:[1]},
    {e:"🍵",t:"入口微苦，回味悠长——慢热型，该懂的人自然懂",s:[3]},
    {e:"🍯",t:"甜得直接了当——从不拐弯抹角，喜欢就大声说",s:[6]},
    {e:"🌸",t:"细腻温润像花茶——不浓烈，但让人安心",s:[11]}
  ]},
  {q:"你觉得云南花卉最打动你的是什么？",o:[
    {e:"🔥",t:"热烈！玫瑰开起来漫山遍野，根本收不住",s:[1]},
    {e:"💪",t:"顽强！三角梅给墙根就往上爬，混凝土里也能开花",s:[6]},
    {e:"🧘",t:"孤傲！绿绒蒿只开在四千米以上的地方，不轻易被看见",s:[7]},
    {e:"✨",t:"治愈！薰衣草田像给大地铺了层温柔的紫色毛毯",s:[12]}
  ]},
  {q:"斗南花市每4秒落下一槌拍卖，你觉得这种感觉最像什么？",o:[
    {e:"🎢",t:"心跳加速！每一秒都是新的竞拍、新的惊喜",s:[1]},
    {e:"🎼",t:"一场有序的交响乐，快节奏但有它自己的规律",s:[5]},
    {e:"🎬",t:"像在看一部纪录片——震撼、真实、想亲眼去看",s:[9]},
    {e:"🕰️",t:"时间流过——那么多的花转瞬即逝，却充满力量",s:[12]}
  ]},
  {q:"如果让你选一种花装饰你的房间，你选？",o:[
    {e:"🌻",t:"向日葵——阳光灿烂，进屋就是好心情",s:[10]},
    {e:"🌷",t:"马蹄莲——线条简洁很高级，不争不抢但很有氛围",s:[9]},
    {e:"💮",t:"报春花——小巧可爱不占地方，一盆就能点亮整个角落",s:[8]},
    {e:"💐",t:"茉莉花——清新的香气飘满整个房间，温柔又踏实",s:[11]}
  ]},
  {q:"鲜花饼从南诏宫廷走到今天，你最感慨的是什么？",o:[
    {e:"🏰",t:"一千年前贵族吃花，今天我也能吃到——浪漫会传染",s:[1]},
    {e:"📜",t:"兰茂写《滇南本草》，合香楼创制鲜花饼——手艺人撑起了历史",s:[3]},
    {e:"🚀",t:"从宫廷贡品到国民零食——好东西一定会被时间看见",s:[5]},
    {e:"🏡",t:"街头巷尾还在飘着花饼香——真正的传承是润物无声",s:[11]}
  ]}
];

var R = {
  1:{emoji:"🌹",name:"食用玫瑰",type:"你是热烈浪漫的人间烟火",cake:"你的鲜花饼风格：经典原味现烤饼。趁热吃，酥皮簌簌往下掉，玫瑰馅甜得坦坦荡荡——跟你的人一样，从不藏着掖着。",desc:"你是云南低海拔暖谷里那朵尽情绽放的食用玫瑰——热情、直爽、敢爱敢恨。越热烈的阳光你越盛开，走到哪儿都是人群里最鲜活的存在。你喜欢浓烈的甜，也享受俗世的烟火气。从南诏百花宴到今天的嘉华门店——玫瑰花就是那个敢在所有人面前说"我就要开"的品种，跟你一模一样。",tags:["热情直爽","热爱生活","甜而不腻","人间烟火"]},
  2:{emoji:"🌺",name:"高山杜鹃",type:"你是自由奔放的旷野之花",cake:"你的鲜花饼风格：大胆创新口味。传统不够——得加花酱、淋蜂蜜、甚至蘸辣椒试试。你的饼跟别人不一样，你的人生也是。",desc:"你天生属于旷野——像白马雪山四千米处的高山杜鹃，在最冷最不适合活的地方开出最热烈耀眼的花。别问你怎么坚持过来的，问就是"本来就应该这样"。你不被框住，不承认边界，觉得活着就要像杜鹃花海——倾尽全力、不留余力。",tags:["自由奔放","野性生命力","不拘一格","热烈绽放"]},
  3:{emoji:"🪷",name:"兰花",type:"你是清雅出尘的隐士之花",cake:"你的鲜花饼风格：花茶配手工慢烤。不急——饼不赶时间，你也不赶。配一杯普洱细细嚼，别人吃饼为解馋，你是为了品。",desc:"你像苍山深处那株幽兰——安静、内敛、不争不抢却自有风骨。兰茂在《滇南本草》里写兰花，不是因为它最香，而是因为它长在最不起眼的山谷里，恰好被最懂花的人看见。你不急于被理解——该懂你的人，自然会来。",tags:["清雅内敛","自有风骨","慢热型","深藏不露"]},
  4:{emoji:"🌸",name:"高原百合",type:"你是纯粹通透的澄澈之花",cake:"你的鲜花饼风格：古法手工慢烤。不要花哨包装，不要噱头口味——就要最原始那朵玫瑰、最传统那团酥皮。简单，就是最强的表达。",desc:"你不随波逐流，像高海拔冷凉区悄然绽放的反季百合——不在主流赛道里争抢，却在最淡的季节开出最干净的花。合香楼老师傅的手艺传了一百多年，不是因为想火，是因为有人还在认真揉那块酥皮。你也是这种人——温和而有力量，纯粹而不简单。",tags:["纯粹通透","温柔有力量","不争不抢","干净澄澈"]},
  5:{emoji:"🌸",name:"滇山茶",type:"你是端庄大气的从容之花",cake:"你的鲜花饼风格：经典礼盒装。不花里胡哨，但拿出来谁都认识——你是那个永远不出错的选择，也是那个最不能被替代的底气。",desc:"你像昆明金殿那棵百年山茶树——从来不急不躁，每年春节前后准时开满一树繁花。你有一种稳如泰山的从容感，不需要证明什么，存在本身就让人放心。云南八大名花之首不是争来的，是一年年开出来的——你的底气也一样。",tags:["端庄大气","从容不迫","经典永存","稳如泰山"]},
  6:{emoji:"🌺",name:"三角梅",type:"你是坚韧不拔的生命之花",cake:"你的鲜花饼风格：随时随地都能吃到的街边烤饼。不讲究场合，不讲究仪式感，给个墙根就能长成花瀑——你的饼跟你的生命力一样顽强。",desc:"你是云南干热河谷里那株三角梅——不在乎土壤、不需要精心打理，墙根下、公路边，只要有一点阳光就能开成瀑布。你在什么环境下都能活出自己的样子，别人羡慕你皮实，你说从来没人给过你第二个选项。但正是这种韧性，让你最不可战胜。",tags:["坚韧顽强","生命力爆棚","朴实无华","生生不息"]},
  7:{emoji:"💎",name:"绿绒蒿",type:"你是遗世独立的孤高之花",cake:"你的鲜花饼风格：限定季节限量口味。不量产、不铺货、不迎合。吃得到是运气，吃不到是常态——你的饼，跟别人不在一条赛道上。",desc:"你是云南极高海拔处那株蓝紫色的绿绒蒿——只开在四千米以上的流石滩上，普通人看不到，看到了也采不到。你不稀罕满山满谷的热闹，觉得没必要跟任何人解释为什么只在这里开花。你的孤独是主动的、骄傲的——不是没人来，是你设了门槛。",tags:["遗世独立","不为谁开","孤高而美","不可攀折"]},
  8:{emoji:"💮",name:"报春花",type:"你是活泼灵动的春风之花",cake:"你的鲜花饼风格：新口味首发永远第一个尝。每年春天第一炉现烤饼出来的时候，你已经在摊位前排好了队。对新事物的好奇心比谁都强。",desc:"你是云南早春最亮眼的那抹粉——当别人还裹着外套等暖和，你已经顶开冻土铺满整片草地了。你喜欢做那个"第一个"：第一个尝新口味、第一个发朋友圈、第一个冲去斗南拍花。你的快乐来得很简单——好看的、好吃的、好玩的，都能让你眼睛发亮。",tags:["活泼灵动","永远好奇","元气满满","快乐至上"]},
  9:{emoji:"🌷",name:"马蹄莲",type:"你是神秘优雅的艺术之花",cake:"你的鲜花饼风格：冷吃更惊艳。不喜欢烫嘴的热闹，喜欢把饼晾凉了慢慢品——凉下来的花馅层次更分明，跟你的性格一样，越品越有味道。",desc:"你是温室里那株线条简洁的马蹄莲——不张扬但有格调，不多话但有分量。你不喜欢被一眼看透，觉得人跟花一样，应该有点神秘感。斗南花市里马蹄莲总是被单独摆在一个角落——不像玫瑰那样热闹，但买它的人往往最懂花。",tags:["神秘优雅","不随俗流","精致格调","暗香浮动"]},
  10:{emoji:"🌻",name:"向日葵",type:"你是阳光灿烂的温暖之花",cake:"你的鲜花饼风格：一定要分享。买一盒不是一个人吃——办公室每人掰一块，你说"好吃吧？"的时候牙齿都在发光。",desc:"你是云南温暖河谷里那株永远追着太阳的向日葵——走到哪里都是小太阳，你的存在就是充电宝。别人低落的时候最喜欢找你聊天，因为你总有办法让最丧的事情听起来也没那么糟。向日葵的花盘永远是圆的——你也是，什么事情到你这里都能兜得住。",tags:["阳光温暖","永远向阳","人见人爱","乐观即正义"]},
  11:{emoji:"🤍",name:"茉莉花",type:"你是温柔细腻的治愈之花",cake:"你的鲜花饼风格：配一杯热牛奶，睡前慢慢吃。你吃饼不是为了解馋，是为了给一天画一个温柔的句号。细腻得刚刚好，不动声色地治愈一切。",desc:"你是昆明人家院子里那丛茉莉——花不大、色不艳，但在夏夜推开窗户，整个院子都是你的香气。你的温柔不喧嚣——朋友心情不好时，你不会说大道理，只是默默把热茶推过去。茉莉是云南花茶里最安静的配角，但没有它，茶就不完整。",tags:["温柔细腻","治愈人心","安静有力","润物无声"]},
  12:{emoji:"💜",name:"薰衣草",type:"你是淡泊从容的岁月之花",cake:"你的鲜花饼风格：放冰箱冷藏着吃。你不急着追新口味，一款合心意的饼能吃很多年。跟你的人一样——长情、念旧、不凑热闹。",desc:"你是云南紫色花田里的薰衣草——不争春、不抢眼，但你经过那片田时，会不由自主停下来深吸一口气。你不介意做配角，知道自己不必时刻站在C位。薰衣草的花语是'等待'——你从不催促时间、不催促感情、不催促自己。岁月会证明，有些东西值得等。",tags:["淡泊从容","长情念旧","不争不抢","岁月静好"]}
};

var scores={},cur=0;
for(var i=1;i<=12;i++)scores[i]=0;
function renderQ(){
  if(cur>=Q.length){showResult();return}
  var q=Q[cur],h='<div class="fade">';
  h+='<div class="progress">';
  for(var i=0;i<Q.length;i++) h+='<span class="'+(i<cur?'done':'')+'"></span>';
  h+='</div><div class="q-title">'+(cur+1)+'/'+Q.length+'  '+q.q+'</div><div class="opts">';
  q.o.forEach(function(o){h+='<div class="opt" onclick="pick(['+o.s.join(',')+'])"><span class="emoji">'+o.e+'</span>'+o.t+'</div>'});
  h+='</div></div>';document.getElementById("app").innerHTML=h;
}
function pick(ids){ids.forEach(function(i){scores[i]++});cur++;renderQ()}
function showResult(){
  var best=1;for(var i=2;i<=12;i++)if(scores[i]>scores[best])best=i;
  var r=R[best],h='<div class="result fade">';
  h+='<div class="big-emoji">'+r.emoji+'</div><h3>'+r.name+'</h3><div class="type">'+r.type+'</div>';
  h+='<div class="desc">'+r.desc+'</div>';
  h+='<div class="cake">'+r.cake+'</div>';
  r.tags.forEach(function(t){h+='<span class="tag">'+t+'</span>'});
  h+='<br><button class="btn" onclick="cur=0;for(var i=1;i<=12;i++)scores[i]=0;renderQ()">♻️ 再测一次</button></div>';
  document.getElementById("app").innerHTML=h;
}
renderQ();
</script>
</body>
</html>
